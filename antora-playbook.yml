# Antora playbook for the Thinkube documentation site.
# Base path per deploy target is set via the `--url` CLI flag, NOT here:
#   cluster (default):  antora antora-playbook.yml            -> base "/"
#   GitHub Pages (SL-6): antora --url /thinkube.org/ ...      -> base "/thinkube.org/"
site:
  title: Thinkube
  start_page: thinkube-docs::index.adoc
  url: /

content:
  sources:
    - url: .
      branches: HEAD
      start_path: .
    # Multi-repo / docs-with-code: the Get Started guide lives in the installer
    # repo that performs the install, and Antora aggregates it here at build
    # time. The installer repo is public, so the cluster build fetches it too.
    - url: https://github.com/thinkube/thinkube-installer.git
      branches: main
      start_path: docs
    # docs-with-code: thinkube-control's docs live in its own repo,
    # beside the control-plane code they describe, and aggregate here at build time.
    - url: https://github.com/thinkube/thinkube-control.git
      branches: main
      start_path: docs
    # docs-with-code: Tandem's user docs live beside the extension code.
    - url: https://github.com/thinkube/thinkube-tandem.git
      branches: main
      start_path: docs
    # docs-with-code: the web app template teaches the template round trip, and
    # its pages live in the template they describe so they stay true to it.
    - url: https://github.com/thinkube/tkt-webapp-react-fastapi.git
      branches: main
      # Not "docs": Copier hands an app everything in the template, and a
      # generated app was inheriting these pages as if they described it.
      start_path: template-docs

ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: ./supplemental-ui

asciidoc:
  extensions:
    # [d2] blocks are rendered by the local d2 binary during the build and
    # embedded as SVG; the build needs d2 on PATH and nothing on the network.
    - ./lib/d2-block.js

output:
  dir: ./build/site

antora:
  extensions:
    - require: '@antora/lunr-extension'
      index_latest_only: true
    # Every :page-type: playbook page must carry its card attributes and the
    # Overview / Instructions / Troubleshooting shape, or the build fails.
    - require: ./lib/playbook-check.js

runtime:
  fetch: true
  log:
    failure_level: warn
